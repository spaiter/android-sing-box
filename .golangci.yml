version: "2"

run:
  go: "1.24"
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true
  build-tags:
    - with_gvisor
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0

linters:
  default: none

  enable:
    # Existing baseline.
    - ineffassign
    - staticcheck
    - unused
    - modernize

    # Core correctness / resource handling.
    - govet
    - errcheck
    - bodyclose

    # Context lifecycle / misuse.
    - noctx
    - contextcheck
    - containedctx
    - fatcontext

    # Concurrency footguns.
    - copyloopvar
    - durationcheck

    # Error-path bugs that often hide leaks.
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil
    - makezero

    # Security-adjacent bug finding.
    - gosec

    # Code-shape pressure. These may be noisy; tune thresholds below.
    - gocritic
    - revive
    - nestif
    - cyclop
    - gocognit

    # Enforce useful nolint comments.
    - nolintlint

  settings:
    modernize:
      disable:
        # Nested struct omitempty -> omitzero changes JSON output semantics.
        - omitzero

    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$

    rules:
      # Tests often intentionally use background contexts or store test contexts.
      # Keep paralleltest enabled, but relax context-specific rules in tests.
      - path: _test\.go
        linters:
          - noctx
          - containedctx
          - fatcontext

      # Generated/mocks/fixtures tend to be noisy beyond the global path exclusions.
      - path: (mock|mocks|testdata|fixtures)/
        linters:
          - revive
          - gocritic
          - cyclop
          - gocognit
          - errcheck
          - gosec

formatters:
  enable:
    - gci
    - gofumpt

  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
